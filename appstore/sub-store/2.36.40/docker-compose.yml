services:
  sub-store:
    image: e54385991/sub-store:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
        - 1panel-network
    environment:
        SUB_STORE_DATA_BASE_PATH: /opt/app/data
        SUB_STORE_BACKEND_API_HOST: 0.0.0.0
        SUB_STORE_BACKEND_API_PORT: 3000
        SUB_STORE_BACKEND_MERGE: "true"
        SUB_STORE_BACKEND_PREFIX: "true"
        SUB_STORE_FRONTEND_BACKEND_PATH: ${SUB_STORE_FRONTEND_BACKEND_PATH}
        SUB_STORE_FRONTEND_PATH: /opt/sub-store/frontend
        SUB_STORE_CORS_ALLOWED_ORIGINS: ${SUB_STORE_CORS_ALLOWED_ORIGINS}
        SUB_STORE_BACKEND_SYNC_CRON: ${SUB_STORE_BACKEND_SYNC_CRON}
        SUB_STORE_PRODUCE_CRON: ${SUB_STORE_PRODUCE_CRON}
    ports:
        - ${PANEL_APP_PORT_HTTP}:3000
    volumes:
        - ./data:/opt/app/data
    labels:
        createdBy: "Apps"

networks:
    1panel-network:
        external: true
