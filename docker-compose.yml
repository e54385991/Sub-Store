services:
  sub-store:
    image: ${SUB_STORE_IMAGE:-e54385991/sub-store:2.36.40}
    container_name: ${SUB_STORE_CONTAINER_NAME:-sub-store}
    restart: unless-stopped
    environment:
      SUB_STORE_DATA_BASE_PATH: /opt/app/data
      SUB_STORE_BACKEND_API_HOST: 0.0.0.0
      SUB_STORE_BACKEND_API_PORT: 3000
      SUB_STORE_BACKEND_PREFIX: ${SUB_STORE_BACKEND_PREFIX:-true}
      SUB_STORE_FRONTEND_BACKEND_PATH: ${SUB_STORE_FRONTEND_BACKEND_PATH:-/sub-store}
      SUB_STORE_CORS_ALLOWED_ORIGINS: ${SUB_STORE_CORS_ALLOWED_ORIGINS:-*}
      SUB_STORE_BACKEND_SYNC_CRON: ${SUB_STORE_BACKEND_SYNC_CRON:-}
      SUB_STORE_PRODUCE_CRON: ${SUB_STORE_PRODUCE_CRON:-}
    ports:
      - ${SUB_STORE_PORT:-3000}:3000
    volumes:
      - ${SUB_STORE_DATA_DIR:-./data}:/opt/app/data

